xt x="68" y="180" class="m p0" font-size="14" fill="#c9d1d9">forecasting industrial emissions</text><text x="68" y="180" class="m p1" font-size="14" fill="#c9d1d9">reverse-engineering game controllers</text><text x="68" y="180" class="m p2" font-size="14" fill="#c9d1d9">chasing exoplanets in NASA light curves</text><text x="68" y="180" class="m p3" font-size="14" fill="#c9d1d9">building pipelines that run unattended</text><rect x="68" y="168" width="8" height="15" fill="#5eead4" class="cursor" opacity=".0"/><rect x="48" y="200" width="113" height="24" rx="12" fill="none" stroke="#30363d"/><text x="105" y="216" text-anchor="middle" class="m" font-size="10" fill="#7d8590" letter-spacing="1">DATA SCIENCE</text><rect x="169.2" y="200" width="37" height="24" rx="12" fill="none" stroke="#30363d"/><text x="188" y="216" text-anchor="middle" class="m" font-size="10" fill="#7d8590" letter-spacing="1">AI</text><rect x="214.39999999999998" y="200" width="83" height="24" rx="12" fill="none" stroke="#30363d"/><text x="256" y="216" text-anchor="middle" class="m" font-size="10" fill="#7d8590" letter-spacing="1">C# / C++</text><rect x="305.2" y="200" width="166" height="24" rx="12" fill="none" stroke="#30363d"/><text x="388" y="216" text-anchor="middle" class="m" font-size="10" fill="#7d8590" letter-spacing="1">REVERSE ENGINEERING</text><line x1="640" y1="70" x2="720" y2="40" stroke="#30363d" class="ed" style="animation-delay:0.2s"/><line x1="720" y1="40" x2="800" y2="90" stroke="#30363d" class="ed" style="animation-delay:0.6000000000000001s"/><line x1="800" y1="90" x2="880" y2="50" stroke="#30363d" class="ed" style="animation-delay:1.0s"/><line x1="640" y1="70" x2="700" y2="130" stroke="#30363d" class="ed" style="animation-delay:0.8s"/><line x1="700" y1="130" x2="780" y2="160" stroke="#30363d" class="ed" style="animation-delay:1.8s"/><line x1="800" y1="90" x2="780" y2="160" stroke="#30363d" class="ed" style="animation-delay:1.4000000000000001s"/><line x1="780" y1="160" x2="860" y2=