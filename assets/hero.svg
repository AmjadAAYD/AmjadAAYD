<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Amjad Aayd: data science, AI and hardware tooling"><style>.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}.grid{animation:drift 20s linear infinite}@keyframes drift{to{transform:translateX(32px)}}.scan{animation:scan 7s linear infinite}@keyframes scan{0%{transform:translateX(-200px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1160px);opacity:0}}.cursor{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.b1{animation:f1 14s ease-in-out infinite alternate}.b2{animation:f2 18s ease-in-out infinite alternate}@keyframes f1{to{transform:translate(120px,30px)}}@keyframes f2{to{transform:translate(-140px,-20px)}}.pulse{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 6s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:900}50%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}.nd{animation:nd 3s ease-in-out infinite}@keyframes nd{50%{opacity:.25}}.ed{stroke-dasharray:4 6;animation:ed 2s linear infinite}@keyframes ed{to{stroke-dashoffset:-20}}.dot{animation:blink2 2s ease-in-out infinite}@keyframes blink2{50%{opacity:.3}}.p0{clip-path:inset(0 100% 0 0);animation:y0 16.0s infinite}@keyframes y0{0%,1.25%{clip-path:inset(0 100% 0 0);animation-timing-function:steps(32,end)}11.25%{clip-path:inset(0 0 0 0)}22.50%{clip-path:inset(0 0 0 0)}24.38%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 100% 0 0)}}.p1{clip-path:inset(0 100% 0 0);animation:y1 16.0s infinite}@keyframes y1{0%,26.25%{clip-path:inset(0 100% 0 0);animation-timing-function:steps(36,end)}36.25%{clip-path:inset(0 0 0 0)}47.50%{clip-path:inset(0 0 0 0)}49.38%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 100% 0 0)}}.p2{clip-path:inset(0 100% 0 0);animation:y2 16.0s infinite}@keyframes y2{0%,51.25%{clip-path:inset(0 100% 0 0);animation-timing-function:steps(39