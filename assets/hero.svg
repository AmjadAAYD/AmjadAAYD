<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="Amjad Aayd — data science, AI, open source">
  <style>
    .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{0%{transform:translateX(-200px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1160px);opacity:0}}
    .cursor{animation:blink 1.2s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .grid{animation:drift 20s linear infinite}
    @keyframes drift{to{transform:translateX(32px)}}
    .pulse{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 6s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:900}50%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
    @media (prefers-reduced-motion:reduce){.scan,.cursor,.grid{animation:none}.pulse{animation:none;stroke-dashoffset:0}}
  </style>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d"/>
    </pattern>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="c"><rect width="960" height="220" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="960" height="220" fill="#0d1117"/>
    <rect x="-32" width="1024" height="220" fill="url(#dots)" class="grid"/>
    <rect width="960" height="220" fill="url(#fade)"/>

    <text x="48" y="58" class="mono" font-size="13" fill="#7d8590" letter-spacing="2">@AMJADAAYD</text>
    <text x="48" y="122" class="sans" font-size="56" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">Amjad Aayd</text>
    <text x="48" y="158" class="sans" font-size="20" fill="#8b949e">Data science, AI and hardware tooling<tspan class="cursor" fill="#5eead4">_</tspan></text>

    <g class="mono" font-size="12" fill="#7d8590" letter-spacing="1">
      <text x="48" y="190">DATA SCIENCE</text>
      <text x="160" y="190" fill="#30363d">/</text>
      <text x="176" y="190">AI</text>
      <text x="204" y="190" fill="#30363d">/</text>
      <text x="220" y="190">OPEN SOURCE</text>
    </g>

    <path d="M560 120 H640 L656 120 L668 84 L684 156 L698 104 L710 120 H800 L812 120 L822 98 L834 140 L844 120 H912" fill="none" stroke="#5eead4" stroke-opacity=".55" stroke-width="1.5" stroke-linejoin="round" class="pulse"/>
    <text x="912" y="168" text-anchor="end" class="mono" font-size="11" fill="#7d8590" letter-spacing="1.5">HID · INPUT REPORT</text>

    <line x1="0" y1="219" x2="960" y2="219" stroke="#21262d" stroke-width="2"/>
    <g class="scan"><rect x="0" y="218" width="200" height="2" fill="url(#trail)"/></g>
  </g>
  <rect x=".5" y=".5" width="959" height="219" rx="12" fill="none" stroke="#30363d"/>
</svg>
