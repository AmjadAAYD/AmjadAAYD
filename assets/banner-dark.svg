<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Amjad Aayd: data science, AI and hardware tooling"><style>.t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}.led{animation:led 5s linear infinite}@keyframes led{to{transform:translateX(-50%)}}.d1{animation:d1 16s ease-in-out infinite alternate}.d2{animation:d2 21s ease-in-out infinite alternate}.d3{animation:d3 26s ease-in-out infinite alternate}@keyframes d1{to{transform:translate(40px,18px)}}@keyframes d2{to{transform:translate(-50px,-14px)}}@keyframes d3{to{transform:translate(24px,-26px)}}.ring{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.ln{opacity:0;animation:ln 12.8s infinite}@keyframes ln{0%{opacity:0;transform:translateY(8px)}3.12%{opacity:1;transform:none}25.00%{opacity:1;transform:none}28.12%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.ln:first-of-type{opacity:1}}</style><defs><radialGradient id="g1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.3"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient><radialGradient id="g3"><stop offset="0" stop-color="#e879f9" stop-opacity="0.24"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/></radialGradient><linearGradient id="led" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#7c5cff"/><stop offset=".66" stop-color="#e879f9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#e879f9"/></linearGradient><clipPath id="av"><circle cx="1040" cy="200" r="98"/></clipPath><clipPath id="rc"><rect width="1280" height="400" rx="14"/></clipPath><clipPath id="lc"><rect x="66" y="222" width="300" height="5" rx="2.5"/></clipPath></defs><rect width="1280" height="400" rx="14" fill="#0b0f17"/><g clip-path="url(#rc)"><g class="d1"><ellipse cx="1000" cy="200" rx="380" ry="230" fill="url(#g1)"/></g><g class="d2"><ellipse cx="1180" cy="330" rx="320" ry="200" fill="url(#g3)"/></g><g class="d3"><ellipse cx="760" cy="90" rx="320" ry="170" fill="url(#g2)"/></g></g><text x="66" y="100" class="m" font-size="13" letter-spacing="1.8" fill="#8b97ab">@AMJADAAYD · OPEN SOURCE</text><text x="60" y="196" class="t" font-size="100" font-weight="800" letter-spacing="-3.5" fill="#f4f7fb">Amjad Aayd</text><g clip-path="url(#lc)"><rect class="led" x="66" y="222" width="600" height="5" fill="url(#led)"/></g><text x="66" y="276" class="t" font-size="26" font-weight="600" fill="#f4f7fb">Data science, AI and hardware tooling.</text><text class="ln m" style="animation-delay:0.0s" x="66" y="322" font-size="18" fill="#cbd5e1"><tspan fill="#22d3ee">&gt;</tspan> forecasting industrial emissions</text><text class="ln m" style="animation-delay:3.2s" x="66" y="322" font-size="18" fill="#cbd5e1"><tspan fill="#22d3ee">&gt;</tspan> reverse-engineering game controllers</text><text class="ln m" style="animation-delay:6.4s" x="66" y="322" font-size="18" fill="#cbd5e1"><tspan fill="#22d3ee">&gt;</tspan> chasing exoplanets in NASA light curves</text><text class="ln m" style="animation-delay:9.6s" x="66" y="322" font-size="18" fill="#cbd5e1"><tspan fill="#22d3ee">&gt;</tspan> building pipelines that run unattended</text><text x="66" y="372" class="m" font-size="13" fill="#8b97ab">Data science · AI · C# · C++ · Reverse engineering</text><circle class="ring" cx="1040" cy="200" r="112" fill="none" stroke="url(#ringg)" stroke-width="3" stroke-dasharray="520 184" stroke-linecap="round"/><circle cx="1040" cy="200" r="104" fill="#0b0f17"/><image href="data:image/jpeg;base64," x="942" y="102" width="196" height="196" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/><rect x=".5" y=".5" width="1279" height="399" rx="14" fill="none" stroke="#2a3140"/></svg>