<text x="24" y="74" class="s" font-size="13" fill="#8b949e">Finding real exoplanets in raw NASA light curves with a</text><text x="24" y="92" class="s" font-size="13" fill="#8b949e">classical BLS search, validated on TRAPPIST-1 and Kepler,</text><text x="24" y="110" class="s" font-size="13" fill="#8b949e">plus a CNN vetting step and a demo site.</text><rect x="24" y="140" width="62" height="22" rx="5" fill="#161b22" stroke="#30363d"/><text x="55" y="155" text-anchor="middle" class="m" font-size="11" fill="#c9d1d9">Python</text><rect x="94.4" y="140" width="40" height="22" rx="5" fill="#161b22" stroke="#30363d"/><text x="114" y="155" text-anchor="middle" class="m" font-size="11" fill="#c9d1d9">BLS</text><rect x="142.60000000000002" y="140" width="40" height="22" rx="5" fill="#161b22" stroke="#30363d"/><text x="163" y="155" text-anchor="middle" class="m" font-size="11" fill="#c9d1d9">CNN</text>
<rect x="24" y="174" width="40" height="2" rx="1" fill="#5eead4" class="bar"/>
